name: Fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "120"
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/llm-inspect/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [scan, rules, validate]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }}
        run: |
          SECONDS_PER_TARGET="${{ github.event.inputs.seconds || '60' }}"
          cargo fuzz run ${{ matrix.target }} -- -max_total_time="$SECONDS_PER_TARGET" -max_len=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
